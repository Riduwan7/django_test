{% extends 'base.html' %}

{% block content %}

<a href="/create/" class="inline-block mb-4">
    <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md">
        Add Note
    </button>
</a>

<ul class="space-y-3">
    {% for note in notes %}
        <li class="flex justify-between items-center border-b pb-3">
            <strong class="text-lg text-gray-800">
                {{ note.title }}
            </strong>

            <div class="space-x-3">
                <a href="/update/{{ note.id }}/"
                   class="text-green-600 hover:underline">
                    Edit
                </a>
                <a href="/delete/{{ note.id }}/"
                   class="text-red-600 hover:underline">
                    Delete
                </a>
            </div>
        </li>
    {% empty %}
        <li class="text-gray-500">No notes available.</li>
    {% endfor %}
</ul>

{% endblock %}
